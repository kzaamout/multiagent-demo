<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling AI · Sign in</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-form" action="/demo" method="get" data-part="login">
    <div class="login-brand-row">
      <div class="login-brand">Sterling AI <span class="muted">· Multi-agent demo</span></div>
    </div>
    <label class="field">Username
      <input class="text-input" type="text" name="username" autocomplete="username">
    </label>
    <label class="field">Password
      <input class="text-input" type="password" name="password" autocomplete="current-password">
    </label>
    <a class="btn-signin" href="/demo" title="The shared login is enforced from slice S7">Sign in</a>
  </form>
</div>
</body>
</html>
