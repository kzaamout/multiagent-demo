<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling AI · Sign in</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-form" action="/login" method="post" data-part="login">
    <div class="login-brand-row">
      <div class="login-brand">Sterling AI <span class="muted">· Multi-agent demo</span></div>
    </div>
    <label class="field">Username
      <input class="text-input" type="text" name="username" autocomplete="username">
    </label>
    <label class="field">Password
      <input class="text-input" type="password" name="password" autocomplete="current-password">
    </label>
    {{LOGIN_ERROR}}
    <input type="hidden" name="next" value="{{LOGIN_NEXT}}">
    <button class="btn-signin" type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
