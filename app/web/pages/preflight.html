<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling AI · Pre-flight</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="page-white">
<div class="page">
  <header class="hdr" data-part="header">
    <div class="brand-wrap"><span class="brand">Sterling AI <span class="muted">· Multi-agent demo</span></span></div>
    <nav class="nav">
      <span class="nav-current nav-pf">Pre-flight<span class="pf-dot" data-part="preflight-indicator" data-status="{{PREFLIGHT_STATUS}}" title="{{PREFLIGHT_TITLE}}">{{PREFLIGHT_GLYPH}}</span></span>
      <a href="/introduction">Introduction</a>
      <a href="/demo">Demo</a>
      <a href="/settings">Settings</a>
      <span class="build-stamp" data-part="build-stamp">{{BUILD_STAMP}}</span>
    </nav>
  </header>
  <main class="pf-main">
    <div class="pf-head">
      <h1 class="page-title">Pre-flight</h1>
      <button class="btn-pf" id="run-preflight" type="button">Run pre-flight</button>
    </div>
    <div class="pf-confirmation" id="pf-confirmation" data-part="confirmation" hidden>
      <div class="pf-confirmation-mark">✓</div>
      <div>
        <div class="pf-confirmation-title">All checks pass</div>
        <div class="pf-confirmation-line" id="pf-confirmation-line"></div>
      </div>
    </div>
    <div class="pf-rows" id="pf-rows" data-part="check-rows"></div>
    <p class="pf-note" id="pf-note" data-part="preflight-note"></p>
  </main>
</div>
<script src="/static/js/preflight.js"></script>
</body>
</html>
