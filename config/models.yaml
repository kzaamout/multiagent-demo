# Providers, models, and seat defaults for live runs.
# additional_args are extra request fields: top-level request arguments for Ollama, additionalModelRequestFields for Bedrock.
# Facts verified 2026-09-14 from official pages; see specs/002-live-team-clean-run/research.md.
# Prices are USD per million tokens and are used for estimated cost on the meters only.
# No credentials here: availability is detected from .env and the boto3 credential chain.

providers:
  bedrock:
    label: Amazon Bedrock
    region: ca-central-1          # owner decision 2026-09-15: us. geo profile, data stays in US and Canada
  google:
    label: Google Gemini
    env_key: GEMINI_API_KEY
  xai:
    label: xAI
    env_key: XAI_API_KEY
  ollama:
    label: Ollama
    host: http://localhost:11434

models:
  bedrock-sonnet-5:
    provider: bedrock
    model_id: us.anthropic.claude-sonnet-5
    label: claude-sonnet-5 via Bedrock
    image_input: true
    temperature: false            # rejects any non-default temperature
    max_tokens: 16000             # a full bill of materials reply is long; the provider default cut it off
    additional_args: {thinking: {type: disabled}}   # adaptive thinking is on by default and is not streamed; a long silent think dropped the connection
    price_in: 2.20
    price_out: 11.00
  bedrock-sonnet-4-6:
    provider: bedrock
    model_id: us.anthropic.claude-sonnet-4-6
    label: claude-sonnet-4.6 via Bedrock
    image_input: true
    temperature: true
    price_in: 3.30
    price_out: 16.50
  bedrock-haiku-4-5:
    provider: bedrock
    model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
    label: claude-haiku-4.5 via Bedrock
    image_input: true
    temperature: true
    price_in: 1.10
    price_out: 5.50
  gemini-2-5-pro:
    provider: google
    model_id: gemini/gemini-2.5-pro
    label: gemini-2.5-pro via Google
    image_input: true
    temperature: true
    price_in: 1.25
    price_out: 10.00
  gemini-3-8-flash:
    provider: google
    model_id: gemini/gemini-3.8-flash
    label: gemini-3.8-flash via Google
    image_input: true
    temperature: true
    price_in: 0.75
    price_out: 3.75
  grok-4-6:
    provider: xai
    model_id: xai/grok-4.6
    label: grok-4.6 via xAI
    image_input: true
    temperature: true
    price_in: 2.00
    price_out: 6.00
  llama3-1-8b:
    provider: ollama
    model_id: llama3.1:8b
    label: llama3.1 8b, local
    image_input: false
    temperature: true
    options: {num_ctx: 16384}     # Ollama defaults to 4K on GPUs under 24 GB and drops overflow silently
    price_in: 0
    price_out: 0
  qwen3-5-9b:
    provider: ollama
    model_id: qwen3.5:9b
    label: qwen3.5 9b, local
    image_input: true
    temperature: true
    options: {num_ctx: 65536}     # five drawing pages at about 4,800 tokens each fit; 7.6 GB on a 12 GB card
    additional_args: {think: false}   # thinking mode makes every call several times slower
    price_in: 0
    price_out: 0
  gemma4-12b:
    provider: ollama
    model_id: gemma4:12b
    label: gemma4 12b, local
    image_input: true
    temperature: true
    options: {num_ctx: 16384}
    additional_args: {think: false}
    price_in: 0
    price_out: 0
  granite4-1-8b:
    provider: ollama
    model_id: granite4.1:8b
    label: granite4.1 8b, local
    image_input: false
    temperature: true
    options: {num_ctx: 16384}
    price_in: 0
    price_out: 0

# Seat models. Every seat except the Estimator runs locally on Ollama (owner decisions, 2026-09-15). The Estimator
# runs on Claude through Bedrock and costs cents per run; keep COST_CEILING low in .env as the guard.
# The Reviewer is a different model family from the Writer. Qwen 3.5 and Gemma 4 read images, so the
# Estimator can see drawing pages and the Reviewer can judge compiled pages from S4.
seats:
  orchestrator: {model: qwen3-5-9b, temperature: 0.1}
  intake: {model: qwen3-5-9b, temperature: 0.1}
  estimator: {model: bedrock-sonnet-5}   # owner decision 1b, 2026-09-15: the local 9B model misread quantities; run with COST_CEILING
  pricing: {model: qwen3-5-9b, temperature: 0.1}   # owner decision 2026-09-15: Llama 3.1 8B printed its tool call as text
  writer: {model: qwen3-5-9b}
  reviewer: {model: gemma4-12b, temperature: 0.2}

# Cloud seat models confirmed on 2026-09-15, kept for when the owner switches back:
#   orchestrator, intake, estimator, writer: bedrock-sonnet-5
#   pricing: llama3-1-8b at temperature 0.1
#   reviewer: gemini-2-5-pro at temperature 0.2
