# Registry fixture for the Settings screenshot comparison (S5, research D8). The seat defaults and the
# option list carry the labels the Claude Design export shows, so the comparison checks layout and the
# open dropdown against the references while the real page shows the live models from config/models.yaml.
# Not used by the application.

providers:
  bedrock:
    label: Amazon Bedrock
    region: ca-central-1
  google:
    label: Google Gemini
    env_key: GEMINI_API_KEY
  xai:
    label: xAI
    env_key: XAI_API_KEY
  anthropic:
    label: Anthropic
    env_key: ANTHROPIC_API_KEY
  ollama:
    label: Ollama
    host: http://localhost:11434

models:
  export-sonnet:
    provider: bedrock
    model_id: us.anthropic.claude-sonnet
    label: claude-sonnet via Bedrock
    image_input: true
    price_in: 3.00
    price_out: 15.00
  export-sonnet-vision:
    provider: bedrock
    model_id: us.anthropic.claude-sonnet
    label: claude-sonnet via Bedrock (vision)
    image_input: true
    price_in: 3.00
    price_out: 15.00
  export-opus:
    provider: bedrock
    model_id: us.anthropic.claude-opus
    label: claude-opus via Bedrock
    image_input: true
    price_in: 15.00
    price_out: 75.00
  export-gemini:
    provider: google
    model_id: gemini/gemini-2.5-pro
    label: gemini-2.5-pro via Google
    image_input: true
    price_in: 1.25
    price_out: 10.00
  export-llama:
    provider: ollama
    model_id: llama3.1:8b
    label: llama3.1 8b, local
    image_input: false
    price_in: 0
    price_out: 0
  export-grok:
    provider: xai
    model_id: xai/grok-3
    label: grok-3 via xAI
    image_input: false
    price_in: 3.00
    price_out: 15.00
  export-anthropic:
    provider: anthropic
    model_id: claude-sonnet
    label: claude-sonnet via Anthropic
    image_input: true
    price_in: 3.00
    price_out: 15.00

seats:
  orchestrator: {model: export-sonnet}
  intake: {model: export-sonnet}
  estimator: {model: export-sonnet-vision}
  pricing: {model: export-llama}
  writer: {model: export-sonnet}
  reviewer: {model: export-gemini}
  case: {model: export-sonnet}
  market: {model: export-llama}
  single: {model: export-sonnet}
