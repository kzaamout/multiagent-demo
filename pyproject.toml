[project]
name = "sterling-multiagent-demo"
version = "0.1.0"
description = "Sterling AI multi-agent orchestration demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "strands-agents[litellm,ollama]==1.55.1",
    "pypdfium2==5.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "ruff==0.16.7",
    "playwright==1.62.0",
    "pillow==12.3.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# The repository sits in OneDrive, which refuses hardlinks from the uv cache.
link-mode = "copy"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["design", "datasets", "/runs", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.schema.*", "app.orchestrator.*"]
strict = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "litellm", "litellm.*", "ollama", "ollama.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "visual: screenshot comparison tests that need Chromium",
    "compiler: needs Typst and pandoc on the path",
]
addopts = "-q"
